version: 1

formatters:
  baseFormat:
    format: "[{levelname}] {asctime} - {message} ({filename} - {lineno})"
    style: "{"
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: baseFormat
    stream: ext://sys.stdout
  file:
    class: logging.FileHandler
    level: INFO
    filename: '/files/transcriber.log'
    formatter: baseFormat
loggers:
  app:
    level: DEBUG
    handlers: [console, file]
    propagate: False
  cui:
    level: INFO
    handlers: [file]
    propagate: False
root:
  level: WARNING
  handlers: [console]