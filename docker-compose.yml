  backend:
    container_name: backend-$PROJECT_NAME
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - WORKDIR=$WORK_DIR
        - USERNAME=$USER_NAME
        - HOMEDIR=$HOME_DIR
        - USERID=$USER_ID
        - GROUPID=$GROUP_ID
        - HUGGING_FACE_TOKEN=$HUGGING_FACE_TOKEN
    volumes:
      - backend-logs:$WORK_DIR/src/logs
    deploy:
      resources:
        limits:
          cpus: '16'
          memory: 64g
        reservations:
          cpus: '8'
          memory: 16g
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - $IP:8000:8000
    tty: true
    env_file:
      - ./.env
      - ./backend/backend.env
